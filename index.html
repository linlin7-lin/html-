<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩互动游戏 · 入口</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#fff7f0 0%,#f0f7f5 100%);
    min-height:100vh;color:#2C3E50;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .wrap{max-width:640px;width:100%;text-align:center;}
  h1{font-size:28px;margin-bottom:8px;letter-spacing:2px;}
  p.sub{color:#888;font-size:14px;margin-bottom:28px;}
  .cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  a.card{
    display:block;width:270px;background:#fff;border-radius:16px;
    padding:28px 22px;text-decoration:none;color:#2C3E50;
    box-shadow:0 4px 16px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s;
  }
  a.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12);}
  .emoji{font-size:42px;margin-bottom:12px;}
  .name{font-size:19px;font-weight:bold;margin-bottom:8px;}
  a.card.c1 .name{color:#F36F21;}
  a.card.c2 .name{color:#1ABC9C;}
  .desc{font-size:13px;color:#888;line-height:1.6;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>色彩互动游戏</h1>
    <p class="sub">选择一个游戏开始</p>
    <div class="cards">
      <a class="card c1" href="color-challenge.html">
        <div class="emoji">🎨</div>
        <div class="name">配色分析挑战</div>
        <div class="desc">色彩知识闯关：看案例图，判断配色方案，逐关得分。</div>
      </a>
      <a class="card c2" href="color-lines.html">
        <div class="emoji">🧩</div>
        <div class="name">色彩连线</div>
        <div class="desc">看图选色：把案例图与正确的色彩风格对应起来。</div>
      </a>
    </div>
  </div>
</body>
</html>
